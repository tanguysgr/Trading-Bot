name: QuantSwing Backtest Engine

on:
  workflow_dispatch: # Erlaubt das manuelle Starten per Knopfdruck
  schedule:
    - cron: '0 */4 * * *' # Führt das Skript automatisch alle 4 Stunden aus

jobs:
  run-backtester:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Erlaubt GitHub, die trades.json zu speichern
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Trading-Bot Rechen-Engine starten
        run: python backtester.py

      - name: Neue Trades speichern und hochladen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add trades.json
          git commit -m "Bot Update: Neue Trades berechnet [skip ci]" || echo "Keine neuen Daten zum Speichern"
          git push