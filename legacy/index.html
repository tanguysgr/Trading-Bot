<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuantSwing AI — Clean Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0F172A; color: #F8FAFC; font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .active-trade { border-left: 4px solid #3B82F6; background-color: #1E293B; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden">

  <!-- TOP BAR -->
  <header class="h-14 bg-[#0B0F19] border-b border-slate-800 flex items-center justify-between px-4 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
      <h1 class="font-bold text-lg tracking-wide">QUANTSWING <span class="text-slate-500 text-sm font-normal">v3.0 Clean</span></h1>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 text-sm bg-slate-900 px-3 py-1.5 rounded border border-slate-700">
        <span class="text-slate-400">Kapital:</span>
        <input id="accBalance" type="number" value="10000" class="bg-transparent w-20 text-right font-bold focus:outline-none mono text-blue-400">
        <span class="text-slate-400">€ | Risiko: 1%</span>
      </div>
      <button onclick="toggleApiConfig()" class="text-sm px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded border border-slate-600 transition cursor-pointer" id="btnApiKey">
        KI Verbinden
      </button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="flex flex-1 h-[calc(100vh-3.5rem)] overflow-hidden">
    
    <!-- LEFT: TRADE LIST -->
    <aside class="w-1/4 min-w-[280px] bg-[#0F172A] border-r border-slate-800 flex flex-col">
      <div class="p-3 border-b border-slate-800 bg-[#0B0F19]">
        <input type="text" id="searchInput" placeholder="Suchen..." class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition">
      </div>
      <div id="tradeList" class="flex-1 overflow-y-auto">
        <!-- Trades werden hier gerendert -->
      </div>
    </aside>

    <!-- RIGHT: CHART & ACTION PANEL -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#0B0F19]">
      
      <!-- TOP: TRADINGVIEW CHART -->
      <div class="h-3/5 border-b border-slate-800 relative" id="tv_chart_container">
        <!-- Chart Container -->
      </div>

      <!-- BOTTOM: TRADE DATA & AI CHAT -->
      <div class="h-2/5 flex">
        
        <!-- TRADE DETAILS -->
        <div class="w-1/2 border-r border-slate-800 p-5 flex flex-col justify-between overflow-y-auto bg-[#0F172A]">
          <div>
            <div class="flex justify-between items-start mb-4">
              <div>
                <h2 id="tradeTitle" class="text-xl font-bold mono">Lade Daten...</h2>
                <p id="tradeSubtitle" class="text-slate-400 text-sm mt-1">-</p>
              </div>
              <div id="tradeDirection" class="px-3 py-1 rounded text-sm font-bold mono bg-slate-800 text-slate-300">WAIT</div>
            </div>
            
            <p id="tradeHeadline" class="text-sm text-slate-300 mb-6 bg-slate-800/50 p-3 rounded border border-slate-700">-</p>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div class="bg-slate-900 p-3 rounded border border-slate-700">
              <span class="block text-[10px] text-slate-500 uppercase tracking-wider mb-1">Entry</span>
              <span id="tEntry" class="text-lg font-bold mono text-white">-</span>
            </div>
            <div class="bg-slate-900 p-3 rounded border border-rose-900/30">
              <span class="block text-[10px] text-rose-500/70 uppercase tracking-wider mb-1">Stop-Loss</span>
              <span id="tSL" class="text-lg font-bold mono text-rose-400">-</span>
            </div>
            <div class="bg-slate-900 p-3 rounded border border-emerald-900/30">
              <span class="block text-[10px] text-emerald-500/70 uppercase tracking-wider mb-1">Take-Profit</span>
              <span id="tTP" class="text-lg font-bold mono text-emerald-400">-</span>
            </div>
            <div class="bg-slate-900 p-3 rounded border border-slate-700">
              <span class="block text-[10px] text-slate-500 uppercase tracking-wider mb-1">CRV (Risk/Reward)</span>
              <span id="tRR" class="text-lg font-bold mono text-blue-400">-</span>
            </div>
            <div class="bg-slate-900 p-3 rounded border border-slate-700 col-span-2 flex justify-between items-center">
              <div>
                <span class="block text-[10px] text-slate-500 uppercase tracking-wider mb-1">Empfohlene Positionsgröße</span>
                <span id="tSize" class="text-lg font-bold mono text-amber-400">-</span>
              </div>
              <div class="text-right">
                <span class="block text-[10px] text-slate-500 uppercase tracking-wider mb-1">Risiko (1%)</span>
                <span id="tRiskEur" class="text-sm font-bold mono text-slate-300">-</span>
              </div>
            </div>
          </div>
        </div>

        <!-- AI CHAT -->
        <div class="w-1/2 flex flex-col bg-[#0B0F19]">
          <div class="p-3 border-b border-slate-800 flex justify-between items-center">
            <span class="text-xs font-bold uppercase text-slate-400 tracking-wider">KI Co-Pilot</span>
            <div class="flex gap-2">
              <button onclick="askAi('Risiken?')" class="text-[10px] bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded cursor-pointer transition">Risiken?</button>
              <button onclick="askAi('News-Einfluss?')" class="text-[10px] bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded cursor-pointer transition">Makro/News?</button>
            </div>
          </div>
          <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm">
            <div class="text-slate-400 text-xs text-center mt-10">Warte auf Setup-Auswahl...</div>
          </div>
          <form onsubmit="handleChat(event)" class="p-3 border-t border-slate-800 flex gap-2">
            <input type="text" id="chatInput" placeholder="Frage an die KI..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm font-semibold transition cursor-pointer">Senden</button>
          </form>
        </div>

      </div>
    </main>
  </div>

  <!-- API KEY MODAL -->
  <div id="apiModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">
    <div class="bg-slate-900 p-6 rounded-lg border border-slate-700 w-96">
      <h3 class="font-bold text-lg mb-4">Gemini API Key</h3>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 mb-4 text-sm focus:outline-none">
      <div class="flex justify-end gap-2">
        <button onclick="toggleApiConfig()" class="px-4 py-2 rounded text-sm bg-slate-800 hover:bg-slate-700 cursor-pointer">Abbrechen</button>
        <button onclick="saveApiKey()" class="px-4 py-2 rounded text-sm bg-blue-600 hover:bg-blue-500 cursor-pointer">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    let trades = [];
    let activeTrade = null;

    // --- LADE PYTHON DATEN (OHNE FAKE DATEN) ---
    async function loadData() {
      try {
        const res = await fetch('trades.json?t=' + Date.now());
        if (!res.ok) throw new Error("trades.json nicht gefunden");
        trades = await res.json();
        
        if (trades.length > 0) {
          activeTrade = trades[0];
          renderList();
          renderTrade();
        } else {
          showError("Die trades.json ist leer. Keine Signale gefunden.");
        }
      } catch (err) {
        showError("trades.json konnte nicht geladen werden. Bitte führe das Python-Skript in GitHub Actions aus!");
      }
    }

    function showError(msg) {
      document.getElementById('tradeList').innerHTML = `<div class="p-4 text-rose-400 text-sm text-center font-medium">${msg}</div>`;
      document.getElementById('tradeTitle').textContent = "Keine Daten";
      document.getElementById('tradeHeadline').textContent = "Warte auf Python-Backend...";
    }

    // --- RENDER UI ---
    function renderList() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const list = document.getElementById('tradeList');
      
      const filtered = trades.filter(t => t.ticker.toLowerCase().includes(query) || t.name.toLowerCase().includes(query));
      
      list.innerHTML = filtered.map(t => {
        const isSel = activeTrade && activeTrade.id === t.id;
        const color = t.direction === 'LONG' ? 'text-emerald-400' : 'text-rose-400';
        return `
          <div onclick="selectTrade('${t.id}')" class="p-3 border-b border-slate-800 cursor-pointer hover:bg-slate-800/50 transition ${isSel ? 'active-trade' : ''}">
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold mono text-sm">${t.ticker}</span>
              <span class="text-xs font-bold mono ${color}">${t.direction}</span>
            </div>
            <div class="flex justify-between items-center text-xs text-slate-400">
              <span class="truncate pr-2">${t.name}</span>
              <span class="mono text-blue-400 shrink-0">Score: ${t.score}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectTrade(id) {
      activeTrade = trades.find(t => t.id === id);
      renderList();
      renderTrade();
    }

    function renderTrade() {
      if (!activeTrade) return;
      const t = activeTrade;
      
      // Werte exakt aus Python übernehmen!
      document.getElementById('tradeTitle').textContent = t.ticker;
      document.getElementById('tradeSubtitle').textContent = `${t.name} | Score: ${t.score}/100 | Modus: ${t.mode.toUpperCase()}`;
      
      const dirEl = document.getElementById('tradeDirection');
      dirEl.textContent = t.direction;
      dirEl.className = `px-3 py-1 rounded text-sm font-bold mono ${t.direction === 'LONG' ? 'bg-emerald-900/30 text-emerald-400' : 'bg-rose-900/30 text-rose-400'}`;

      document.getElementById('tradeHeadline').textContent = t.headline;
      document.getElementById('tEntry').textContent = Number(t.entry).toFixed(2);
      document.getElementById('tSL').textContent = Number(t.stopLoss).toFixed(2);
      document.getElementById('tTP').textContent = Number(t.takeProfit).toFixed(2);
      document.getElementById('tRR').textContent = `1 : ${Number(t.rr).toFixed(2)}`;

      // Berechne Positionsgröße basierend auf 1% Risiko
      const balance = parseFloat(document.getElementById('accBalance').value) || 10000;
      const risk = balance * 0.01;
      const stopDistance = Math.abs(t.entry - t.stopLoss);
      const size = stopDistance > 0 ? (risk / stopDistance).toFixed(2) : 0;
      
      document.getElementById('tSize').textContent = `${size} Stück`;
      document.getElementById('tRiskEur').textContent = `${risk.toFixed(2)} €`;

      renderChart(t.ticker);
      
      document.getElementById('chatBox').innerHTML = `<div class="bg-slate-800 p-3 rounded-lg border border-slate-700 text-slate-200">Setup <strong>${t.ticker}</strong> geladen. Hast du Fragen dazu?</div>`;
    }

    // --- TRADINGVIEW ---
    function renderChart(ticker) {
      let tvSym = ticker.replace('-', '').replace('/', '');
      if (ticker.includes('XAU')) tvSym = "OANDA:XAUUSD";
      else if (ticker.includes('BTC')) tvSym = "BINANCE:BTCUSDT";
      else if (ticker.includes('.DE')) tvSym = "XETR:" + ticker.replace('.DE', '');
      else tvSym = "NASDAQ:" + ticker; // Standard US

      document.getElementById('tv_chart_container').innerHTML = "";
      new TradingView.widget({
        "autosize": true,
        "symbol": tvSym,
        "interval": "D",
        "timezone": "Europe/Berlin",
        "theme": "dark",
        "style": "1",
        "locale": "de",
        "toolbar_bg": "#0B0F19",
        "enable_publishing": false,
        "backgroundColor": "#0B0F19",
        "gridColor": "#1E293B",
        "hide_legend": false,
        "save_image": false,
        "container_id": "tv_chart_container"
      });
    }

    // --- API & CHAT ---
    function toggleApiConfig() {
      const m = document.getElementById('apiModal');
      m.classList.toggle('hidden');
      m.classList.toggle('flex');
      document.getElementById('apiKeyInput').value = localStorage.getItem("quantswing_api") || "";
    }

    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem("quantswing_api", val);
      document.getElementById('btnApiKey').textContent = val ? "KI Aktiv ✓" : "KI Verbinden";
      toggleApiConfig();
    }

    async function handleChat(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      askAi(text);
    }

    async function askAi(question) {
      const box = document.getElementById('chatBox');
      box.innerHTML += `<div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700 text-slate-400 text-right ml-8">${question}</div>`;
      box.scrollTop = box.scrollHeight;

      const key = localStorage.getItem("quantswing_api");
      if (!key) {
        box.innerHTML += `<div class="bg-rose-900/20 p-3 rounded-lg border border-rose-900/50 text-rose-400 mr-8">Bitte hinterlege zuerst deinen Gemini API-Key oben rechts.</div>`;
        return;
      }

      box.innerHTML += `<div id="loadingAi" class="text-xs text-slate-500 mt-2">KI tippt...</div>`;
      
      try {
        const t = activeTrade || { ticker: "Markt", direction: "NEUTRAL", score: 0, headline: "" };
        const prompt = `Du bist ein Trading-Assistent. Antworte extrem kurz, präzise und professionell (max. 3 Sätze). 
        Kontext: ${t.ticker} (${t.direction}), Score: ${t.score}. Bot sagt: "${t.headline}". 
        Frage: ${question}`;

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        
        const data = await res.json();
        const answer = data.candidates[0].content.parts[0].text;
        
        document.getElementById('loadingAi').remove();
        box.innerHTML += `<div class="bg-blue-900/20 p-3 rounded-lg border border-blue-900/50 text-slate-200 mr-8">${answer}</div>`;
        box.scrollTop = box.scrollHeight;
      } catch (err) {
        document.getElementById('loadingAi').remove();
        box.innerHTML += `<div class="text-rose-400 text-xs">Fehler bei der KI-Antwort. API Key prüfen.</div>`;
      }
    }

    // INIT
    document.getElementById('btnApiKey').textContent = localStorage.getItem("quantswing_api") ? "KI Aktiv ✓" : "KI Verbinden";
    document.getElementById('searchInput').addEventListener('input', renderList);
    document.getElementById('accBalance').addEventListener('input', renderTrade);
    loadData();
  </script>
</body>
</html>
