name: QuantSwing Autonomer Backtest & KI-Trainer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # Alle 4 Stunden

jobs:
  run-bot-and-train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Markt-Scan & Backtest (Bot ausführen)
        run: python backtester.py

      - name: 2. Autonome KI-Analyse & Code-Optimierung
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_trainer.py

      - name: 3. Ergebnisse & verbesserten Code speichern
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "QuantSwing AI Bot"
          git add trades.json backtester.py
          git commit -m "Bot Update: Neue Trades & autonome KI-Code-Optimierung [skip ci]" || echo "Keine neuen Daten zum Speichern"
          git push
