name: Backtest

# Manuell starten: GitHub → Reiter "Actions" → "Backtest" → "Run workflow".
# Der Bericht erscheint direkt auf der Ergebnisseite des Laufs (Summary),
# alle Trades gibt es unten unter "Artifacts" als Download.
on:
  workflow_dispatch:
    inputs:
      strategie:
        description: "Welche Strategie?"
        type: choice
        default: all
        options: [all, trend_pullback, breakout_volume]
      universum:
        description: "Datei mit Börsenkürzeln"
        default: config/universes/welt.txt
      start:
        description: "Kursdaten ab (JJJJ-MM-TT)"
        default: "2005-01-01"
      stichtag:
        description: "Stichtag Training/Test (JJJJ-MM-TT)"
        default: "2018-01-01"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Datum merken
        run: echo "TAG=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Kursdaten-Cache (schont Yahoo bei mehreren Läufen am selben Tag)
        uses: actions/cache@v6
        with:
          path: .cache/prices
          key: kurse-${{ inputs.start }}-${{ env.TAG }}
      - name: Backtest ausführen
        env:
          STRATEGIE: ${{ inputs.strategie }}
          UNIVERSUM: ${{ inputs.universum }}
          START: ${{ inputs.start }}
          STICHTAG: ${{ inputs.stichtag }}
        run: >
          python -m quantswing backtest
          --strategy "$STRATEGIE" --universe "$UNIVERSUM"
          --start "$START" --split "$STICHTAG" --out results -v
      - name: Bericht anzeigen
        if: always()
        run: cat results/bericht.md >> "$GITHUB_STEP_SUMMARY" || echo "Kein Bericht erzeugt" >> "$GITHUB_STEP_SUMMARY"
      - name: Ergebnisse zum Download bereitstellen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backtest-ergebnisse
          path: results/
          retention-days: 30
